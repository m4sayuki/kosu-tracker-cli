[project]
name = "kosu-tracker-cli"
version = "0.1.0"
description = "CLI tool for background worklog collection and daily effort summaries on macOS"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "OpenAI Codex" }
]
dependencies = []

[project.scripts]
kosu = "kosu_tracker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kosu_tracker*"]
